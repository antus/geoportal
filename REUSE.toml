version = 1

# Files without a comment syntax, or whose comments would reach people (Markdown, JSON, manifests).
# A header in the file itself, where there is one, says the same.
[[annotations]]
path = ["**/*.md", "**/*.json", "**/*.yaml", "**/*.yml", "**/*.toml", ".gitattributes", "**/.gitattributes", ".gitignore", "**/*.svg"]
SPDX-FileCopyrightText = "2026 Massimo Antonini"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The sample datasets of the catalog and the fixtures of the loading tests: synthetic data written
# by extensions/ext-catalog-geodata/src/samples/generate.py (invented places, names and values), free
# for anyone to reuse. Last, so that it wins over the annotation above for samples.json.
[[annotations]]
path = [
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.geojson",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.csv",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.czml",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.gml",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.gpkg",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.gpx",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.kml",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.kmz",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.tif",
  "extensions/ext-catalog-geodata/src/main/resources/samples/*.zip",
  "extensions/ext-catalog-geodata/src/main/resources/samples/samples.json",
  "extensions/ext-catalog-geodata/src/test/resources/load/**",
]
SPDX-FileCopyrightText = "2026 Massimo Antonini"
SPDX-License-Identifier = "CC0-1.0"
