#
# GP-327 F01: config/application.properties of the Mosaikit installation of the proofs
# (run.py copies it there). For the proofs only: these passwords are not secrets.

# The PostGIS of compose.yaml, database mosaikit.
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15433/mosaikit
quarkus.datasource.username=mosaikit
quarkus.datasource.password=f01-proof
quarkus.http.port=18890
mosaikit.bootstrap.admin-password=f01-admin-password
# People register with a password in the proofs, without a mail server.
mosaikit.accounts.confirm-email=false
# Sessions survive a restart of the kernel during the proofs.
quarkus.http.auth.session.encryption-key=f01-proof-session-key-0123456789
# The account GeoServer's calls run as (AuthKey mapper and REST role service of the proof stub, extension dev.geoportal.proofstub).
geoportal.proofstub.service-account=geoserver@f01-proof.test
