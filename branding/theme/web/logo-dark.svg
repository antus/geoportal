<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The mark of Geoportal, for dark backgrounds and the bar of the shell: a four-pointed compass rose with a longer north-south axis,
       in filled shapes only, so that it reads the same from 64 down to 16 pixels. The darker halves
       of the points are a veil over the gradient, the facets of an engraved compass. -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5d8"/><stop offset="100%" stop-color="#3b9eff"/>
    </linearGradient>
  </defs>
  <path d="M16 3.8L19.39 12.61L26.8 16L19.39 19.39L16 28.2L12.61 19.39L5.2 16L12.61 12.61Z" fill="url(#g)"/>
  <g fill="#04121a" opacity=".26">
    <path d="M16 16L16 3.8L19.39 12.61Z"/><path d="M16 16L26.8 16L19.39 19.39Z"/>
    <path d="M16 16L16 28.2L12.61 19.39Z"/><path d="M16 16L5.2 16L12.61 12.61Z"/>
  </g>
</svg>
