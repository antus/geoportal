# SPDX-FileCopyrightText: 2026 Massimo Antonini
id: dev.geoportal.catalog
version: 2.0.0-SNAPSHOT
name: Catalog
description: The catalog of the data of the organization (a mock with demo datasets, until it reads GeoServer and the archive).
kind: [app, service]
platform: '>=0.1 <1'
backend:
  jar: lib/catalog.jar
  api: catalog
database:
  schema: ext_catalog
frontend:
  entry: web/index.js
  isolation: module
  # What the frontend may do when the shell runs it isolated in an iframe.
  bridge:
    publishes: [catalog.*, shell.share]
    services: [api]
# Tools for assistants and MCP clients.
actions:
  - name: list-datasets
    title: List datasets
    description: Lists the datasets of the catalog of the organization, with their theme, format and access.
    risk: read
    call: { method: GET, path: datasets }
  - name: list-uploaded-data
    title: List uploaded data
    description: Lists the datasets uploaded to the catalog that the person sees, with title, technical name, format, state and level.
    risk: read
    call: { method: GET, path: uploads }
# What a person may do in the catalog; off until the administrators grant them, who hold them all.
permissions:
  - name: upload-data
    title: Upload data
    description: Upload files of geographic data to the catalog of the organization.
    i18n:
      it: { title: Caricare dati, description: Caricare file di dati geografici nel catalogo dell'organizzazione. }
  # GP-114, GP-118: publish a loaded dataset as a GeoServer service, republish, repoint and unpublish
  # it; the level manage on the dataset is needed too.
  - name: publish
    title: Publish data as services
    description: Publish loaded datasets as layers of the GeoServer workspace of the organization, and republish, repoint or unpublish them.
    i18n:
      it:
        title: Pubblicare dati come servizi
        description: Pubblicare i dati caricati come livelli del workspace GeoServer dell'organizzazione, e ripubblicarli, ripuntarli o ritirarli.
  # GP-334: the GeoServer workspace of the organization; the administrators hold it.
  - name: manage-geoserver
    title: Manage the GeoServer publication
    description: Publish and withdraw layers and styles in the GeoServer workspace of the organization, and align GeoServer with the catalog.
    i18n:
      it:
        title: Gestire la pubblicazione su GeoServer
        description: Pubblicare e ritirare livelli e stili nel workspace GeoServer dell'organizzazione, e allineare GeoServer al catalogo.
  # GP-939: external services of other servers, reached directly or through the proxy.
  - name: register-service
    title: Register external services
    description: Register OGC services of other servers in the catalog, to use them in maps directly or through the proxy.
    i18n:
      it:
        title: Registrare servizi esterni
        description: Registrare nel catalogo servizi OGC di altri server, da usare nelle mappe direttamente o attraverso il proxy.
  # GP-939: credentials of the organization sent by the proxy to a registered service.
  - name: service-credentials
    title: Send credentials to external services
    description: Have the proxy send a credential of the organization to a registered service, or move such a service to another address.
    i18n:
      it:
        title: Inviare credenziali ai servizi esterni
        description: Far inviare dal proxy una credenziale dell'organizzazione a un servizio registrato, o spostare un servizio che ne ha una a un altro indirizzo.
  # GP-036: write the data of the published layers assigned to the person (WFS-T through the catalog and
  # GeoServer). The surveyor profile of an organization holds it; the editor profile does not.
  - name: edit-layer-data
    title: Edit the data of assigned layers
    description: Insert, change and delete the features of the published layers assigned to the person, through the catalog and through WFS-T of GeoServer.
    i18n:
      it:
        title: Modificare i dati dei livelli assegnati
        description: Inserire, modificare ed eliminare gli oggetti dei livelli pubblicati assegnati alla persona, attraverso il catalogo e il WFS-T di GeoServer.
# The resources of the catalog, shared with the dialog of Mosaikit (GP-936).
resources:
  - type: dataset
    title: Dataset
    i18n:
      it: { title: Dato }
    levels:
      - { name: view, title: View, i18n: { it: { title: Vedere } } }
      - { name: download, title: Download, i18n: { it: { title: Scaricare } } }
      - { name: edit, title: Edit, edits: true, i18n: { it: { title: Modificare } } }
      - { name: edit-data, title: Edit the data, edits: true, i18n: { it: { title: Modificare i dati } } }
      - { name: manage, title: Manage, edits: true, i18n: { it: { title: Gestire } } }
    # GP-336: a link opens the published layer of the dataset, to view only, also without an account.
    subjects: [person, group, organization, link]
    linkLevel: view
  - type: service
    title: External service
    i18n: { it: { title: Servizio esterno } }
    levels:
      - { name: view, title: View, i18n: { it: { title: Vedere } } }
      - { name: use, title: Use, i18n: { it: { title: Usare } } }
      - { name: manage, title: Manage, edits: true, i18n: { it: { title: Gestire } } }
    subjects: [person, group, organization]
# GP-336: what the organization reads of its published geodata, through the gateway and the gate of
# the catalog; platform administrators set a monthly limit, beyond which the requests are refused.
measures:
  - id: data-requests
    label: Requests to the geodata
    unit: requests
    kind: counter
    i18n:
      it: { label: Richieste ai dati geografici }
contributes:
  # The page of a link to a dataset (GP-336): its published layer, for people without an account.
  shared.view:
    - id: dataset
      type: dataset
      element: catalog-shared-dataset
  # The app bar of the shell.
  rail.app:
    - id: catalog
      title: Catalog
      # The name in the language of the person (MK-053 of Mosaikit).
      i18n:
        it: { title: Catalogo }
      route: /app/catalog
      element: catalog-app
      icon: web/icon.svg
