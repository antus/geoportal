id: dev.geoportal.processes
version: 2.0.0-SNAPSHOT
name: Processes
description: The processes of the organization (a mock, until the process designer arrives).
kind: [app]
platform: '>=0.1 <1'
frontend:
  entry: web/index.js
  isolation: module
  # What the frontend may do when the shell runs it isolated in an iframe.
  bridge:
    publishes: [processes.*]
    services: []
contributes:
  # The app bar of the shell.
  rail.app:
    - id: processes
      title: Processes
      # The name in the language of the person (MK-053 of Mosaikit).
      i18n:
        it: { title: Processi }
      route: /app/processes
      element: processes-app
      icon: web/icon.svg
