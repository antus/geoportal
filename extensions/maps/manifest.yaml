id: dev.geoportal.maps
version: 2.0.0-SNAPSHOT
name: Maps
description: The maps of the organization (a mock, until the map viewer arrives).
kind: [app]
platform: '>=0.1 <1'
frontend:
  entry: web/index.js
  isolation: module
  # What the frontend may do when the shell runs it isolated in an iframe.
  bridge:
    publishes: [maps.*]
    services: []
contributes:
  # The app bar of the shell.
  rail.app:
    - id: maps
      title: Maps
      # The name in the language of the person (MK-053 of Mosaikit).
      i18n:
        it: { title: Mappe }
      route: /app/maps
      element: maps-app
      icon: web/icon.svg
