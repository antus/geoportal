#
# Settings of this Geoportal installation, read by the kernel from config/ in the installation
# directory. Every setting can also be given as an environment variable, for example
# QUARKUS_DATASOURCE_PASSWORD for quarkus.datasource.password. Every setting of Mosaikit applies:
# https://github.com/mosaikit/mosaikit/blob/main/distribution/install/application.properties

# PostgreSQL 18 database
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mosaikit
quarkus.datasource.username=mosaikit
quarkus.datasource.password=change-me

# Password of the platform administrator "admin", used only at the first start of an empty
# database. Remove it once the administrator has signed in.
mosaikit.bootstrap.admin-password=change-me-too

# HTTP port
quarkus.http.port=8080

# The look of Geoportal: the theme extension in extensions/theme-*.zip.
mosaikit.ui.theme=dev.geoportal.theme

# The extensions of Geoportal are signed by its build, whose key is in config/trusted-keys: only
# packages signed with a trusted key are accepted. Set "optional" to try extensions of others.
mosaikit.extensions.signatures=required

# The largest upload (files of the catalog included): 1G. The kernel stores files up to
# mosaikit.files.max-size and reads request bodies up to quarkus.http.limits.max-body-size: keep the two
# the same, or the smaller one wins. A larger file is refused with 413 and the limit in the message. A
# proxy in front of Geoportal must accept bodies as large (nginx: client_max_body_size 1g).
mosaikit.files.max-size=1G
quarkus.http.limits.max-body-size=1G

# Federated sign-in: public URL of Keycloak, as it appears in the tokens, and the domain whose
# sub-domains are organization slugs (acme.geoportal.example.org -> organization "acme").
#mosaikit.identity.keycloak-url=https://auth.example.org
#mosaikit.identity.domain=geoportal.example.org
#mosaikit.identity.admin.client-id=mosaikit-admin
#mosaikit.identity.admin.client-secret=<secret>
