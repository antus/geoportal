#
# Settings of this portable Geoportal, read by the kernel at start.
#
# The bundled PostgreSQL is managed by the launcher: its connection settings are generated in
# config/database.properties at each start (do not edit that file). The database files are in
# data/. To back up, stop Geoportal and copy the whole data/ directory.
#
# Every setting can also be given as an environment variable, for example QUARKUS_HTTP_PORT.

# Web interface and API: http://localhost:8080. Only this computer can connect; set the host to
# 0.0.0.0 to accept connections from the network, after changing the administrator password.
quarkus.http.host=127.0.0.1
quarkus.http.port=8080

# The look of Geoportal.
mosaikit.ui.theme=dev.geoportal.theme

# Only the extensions signed with a key of config/trusted-keys, which has the one of Geoportal.
mosaikit.extensions.signatures=required

# The largest upload (files of the catalog included): 1G. The kernel stores files up to
# mosaikit.files.max-size and reads request bodies up to quarkus.http.limits.max-body-size: keep the two
# the same, or the smaller one wins. A larger file is refused with 413 and the limit in the message. A
# proxy in front of Geoportal must accept bodies as large (nginx: client_max_body_size 1g).
mosaikit.files.max-size=1G
quarkus.http.limits.max-body-size=1G
