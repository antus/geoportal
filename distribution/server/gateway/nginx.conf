#
# The data gateway of Geoportal (GP-336): the official configuration of the image, plus the JavaScript
# module (njs) and a log of who read which data.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # The access log of the gateway: the person (or the link) of each data request, its organization and
    # whether the go-ahead came from the cache of ten seconds.
    log_format  gateway  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         'person="$gw_account" organization="$gw_org" go-ahead=$gw_cache '
                         '"$http_user_agent" $request_time';
    access_log  /dev/stdout  gateway;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
