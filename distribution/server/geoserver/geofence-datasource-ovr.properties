#
# GeoFence on PostgreSQL. start.sh writes it into the data directory with the values of the
# environment.
geofenceVendorAdapter.databasePlatform=org.hibernate.spatial.dialect.postgis.PostgisDialect
geofenceDataSource.driverClassName=org.postgresql.Driver
geofenceDataSource.url=jdbc:postgresql://${GEOFENCE_DB_HOST}:5432/${GEOFENCE_DB_NAME}
geofenceDataSource.username=${GEOFENCE_DB_USER}
geofenceDataSource.password=${GEOFENCE_DB_PASSWORD}
geofenceEntityManagerFactory.jpaPropertyMap[hibernate.default_schema]=geofence
geofenceEntityManagerFactory.jpaPropertyMap[hibernate.hbm2ddl.auto]=update
